AWSTemplateFormatVersion: "2010-09-09"
Description: PaperTrail AI - foundation stack

Resources:
  # ---------- Auth ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------- Storage ----------
  DocsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessInvokePermission
    Properties:
      BucketName: !Sub "${AWS::StackName}-docs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["http://localhost:5173"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:Put"
            Function: !GetAtt ProcessFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: "uploads/" }

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: docId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: docId, KeyType: RANGE }

  ChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: chunkId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: chunkId, KeyType: RANGE }

  # ---------- /me Lambda ----------
  MeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-me"
      RetentionInDays: 3

  MeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt MeLogGroup.Arn

  MeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-me"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MeRole.Arn
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref MeLogGroup
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              claims = event["requestContext"]["authorizer"]["jwt"]["claims"]
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"sub": claims.get("sub"), "email": claims.get("email")}),
              }

  # ---------- HTTP API ----------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["http://localhost:5173"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  MeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MeFunction.Arn
      PayloadFormatVersion: "2.0"

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /me"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${MeIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  MeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/me"

  # ---------- Upload URL Lambda ----------
  UploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-get-upload-url"
      RetentionInDays: 3

  UploadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: upload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt UploadLogGroup.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-docs-${AWS::AccountId}-${AWS::Region}/uploads/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt DocumentsTable.Arn

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-upload-url"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt UploadRole.Arn
      Timeout: 10
      Code: ../backend/get_upload_url
      LoggingConfig:
        LogGroup: !Ref UploadLogGroup
      Environment:
        Variables:
          BUCKET: !Sub "${AWS::StackName}-docs-${AWS::AccountId}-${AWS::Region}"
          DOCS_TABLE: !Ref DocumentsTable

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadFunction.Arn
      PayloadFormatVersion: "2.0"

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /upload-url"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${UploadIntegration}"

  UploadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/upload-url"

  # ---------- Textract processing Lambda ----------
  ProcessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-process-doc"
      RetentionInDays: 3

  ProcessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: process
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ProcessLogGroup.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-docs-${AWS::AccountId}-${AWS::Region}/uploads/*"
              - Effect: Allow
                Action: textract:DetectDocumentText
                Resource: "*"
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt DocumentsTable.Arn

  ProcessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-process-doc"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt ProcessRole.Arn
      Timeout: 60
      MemorySize: 256
      Code: ../backend/process_doc
      LoggingConfig:
        LogGroup: !Ref ProcessLogGroup
      Environment:
        Variables:
          DOCS_TABLE: !Ref DocumentsTable

  ProcessInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-docs-${AWS::AccountId}-${AWS::Region}"

  # ---------- List documents Lambda ----------
  ListLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-list-documents"
      RetentionInDays: 3

  ListRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: list
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ListLogGroup.Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt DocumentsTable.Arn

  ListFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-list-documents"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt ListRole.Arn
      Timeout: 10
      Code: ../backend/list_documents
      LoggingConfig:
        LogGroup: !Ref ListLogGroup
      Environment:
        Variables:
          DOCS_TABLE: !Ref DocumentsTable

  ListIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ListFunction.Arn
      PayloadFormatVersion: "2.0"

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /documents"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${ListIntegration}"

  ListInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/documents"
Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  BucketName:
    Value: !Ref DocsBucket
  DocumentsTableName:
    Value: !Ref DocumentsTable
  ChunksTableName:
    Value: !Ref ChunksTable